<html>
<head>
<link rel="stylesheet" href="leaflet/leaflet.css" />
<script src="leaflet/leaflet.js"></script>
<script src="luxon/luxon.js"></script>
<script src="chartjs/chart.umd.js"></script>
<script src="chartjs/chartjs-adapter-luxon.umd.js"></script>
<script src="chartjs/chartjs-plugin-zoom.js"></script>
<style>
#map { height: 500px; }
#charts { height: 200px; }
#zoom_container {
  display: flex;
  justify-content: center;
  align-items: center;
}
</style>
</head>
<body>
    <div id="menu">
        <input type="file" name="geojsonfile" id="geojsonfile">
    </div>
    <div id="map"></div>
    <div id="charts">
        <canvas id="mainChart"></canvas>
        <div id="zoom_container"></div>
    </div>        
<script language="javascript">
// Each point in the geojson file will be represented by this almost transparent icon.
// The goal is to provide interactivity and react when the icon is hover'ed.
// If number of point exceeds a threshold, a sampling should be used.
// If necessary, icon can be enlarged.
// Build inline icon here: https://png-pixel.com

    iconSize: [4, 4], // size of the icon
    iconAnchor: [2, 2], // point of the icon which will correspond to marker's location
    popupAnchor: [-5, -5] // point from which the popup should open relative to the iconAnchor
});

// This icon represents the position of the aircraft in the analysis.

C-264.813%2C387.75 -379.932%2C428.339 -383%2C430C-383.946%2C432.763 -384.653%2C435.29 -385.25%2C438.125L-385.773%2C440.41C-386.197%2C442.27 -386.601%2C444.135 -387%2C446L-388%2C446C-390.521%2C426.911 -390.852%2C408.209 -388.625%2C389.063L-388.243%2C385.757C-387.505%2C380.037 -387.505%2C380.037 -387%2C378L-385%2C377L-382%2C385C-378.78%2C384.195 -137.816%2C249.059 -137%2C247C-136.935%2C245.483 -137.568%2C199.751 -134.632%2C195.867C-128.769%2C191.707 -121%2C192.784 -114.063%2C192.75L-110.854%2C192.688C-104.771%2C192.657 -100.342%2C193.006 -95%2C196C-93%2C198 -92.959%2C222.715 -93%2C226C-85.091%2C222.166 -42%2C197 -38%2C197C-38%2C198.98 -33.461%2C46.277 -22%2C20.031C-22%2C20.031 -11.801%2C-0.336 -1.714%2C-0.336Z%22 style%3D%22fill%3Argb(1%2C1%2C1)%3Bfill-rule%3Anonzero%3B%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E",
    iconSize: [AIRCRAFT_ICON_SIZE, AIRCRAFT_ICON_SIZE], // size of the icon
    iconAnchor: [Math.round(AIRCRAFT_ICON_SIZE/2), Math.round(AIRCRAFT_ICON_SIZE/2)], // point of the icon which will correspond to marker's location
    popupAnchor: [-(AIRCRAFT_ICON_SIZE+2), -(AIRCRAFT_ICON_SIZE+2)] // point from which the popup should open relative to the iconAnchor
});

// Main chart shows speed and altitude (always)
// Like at flightradar24 and flightaware.
const SPEED = "ground_speed";  // name of GeoJSON feature property for speed
const SPEED_CONVERT = {
    "m/s": 1,
    "km/h": 3.6,
    "kt": 1.943844
};
SPEED_UNIT = "kt";

const ALTITUDE = "altitude";  // name of GeoJSON feature property for altitude
const ALTITUDE_CONVERT = {
    "m": 0.3048,
    "ft": 1,
    "fl": 0.001
};
ALTITUDE_UNIT = "ft";

// list of GeoJSON feature properties to ignore for charting
const IGNORE = ["id", "UTC Time", "_raw_ts", "latitude", "longitude", SPEED, ALTITUDE];
const MAX_DATA_PER_CHART = 4;  // number of curves per chart, 6 is reasonable max.

// Globals
var geojson = {};  // whole file
var pointFeatures = {}; // individual points
var latlngs = [];   // minimal data for cursor
var tlabels = [];   // global (uniform) x-axis time ticks
var mainChart = undefined; // for cursor positioning
var mapCursor = undefined; // map cursor
var otherCharts = {}; // for cursor positioning

var chartCandidates = Array(); // additional charts to plot from properties
chartCandidates.remove = function(what) {
    const index = this.indexOf(what);
    if (index > -1) {
        this.splice(index, 1);
    }
}

function buildMap(text) {
    geojson = JSON.parse(text);
    pointFeatures = geojson.features.filter((f) => f.geometry.type == "Point");
    latlngs = pointFeatures.map((f) => [f.geometry.coordinates[1], f.geometry.coordinates[0]]);
    let markers = pointFeatures.map( (f) => {
        m = L.marker([f.geometry.coordinates[1], f.geometry.coordinates[0]], {
            icon: TRANSPARENT_ICON
        })
        m.on("mouseover", function() {
            moveMapCursor(f.id);
            moveChartCursor(f.id);
        })
        return m;
    });
    // Start leaflet
    let avglat = pointFeatures.reduce( (acc, f) => acc + f.geometry.coordinates[1], 0) / pointFeatures.length;
    let avglon = pointFeatures.reduce( (acc, f) => acc + f.geometry.coordinates[0], 0) / pointFeatures.length;
    console.log(avglat, avglon);
    let map = L.map("map").setView([avglat, avglon], 13);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "&copy; <a href='http://www.openstreetmap.org/copyright'>OpenStreetMap</a>"
    }).addTo(map);
    // display whole flight as linestring
    L.polygon(latlngs, {
        color: "darkblue",
        fill: false
    }).addTo(map);
    mapCursor = L.marker(latlngs[0], {
        icon: AIRCRAFT_ICON
    }).addTo(map);

    // add interaction "invisible" points
    markers.forEach((m) => { m.addTo(map); })

    // guess properties list from first point feature
    const f = pointFeatures[0];
    chartCandidates =  Object.keys(f.properties)
        .filter((p) => typeof(f.properties[p]) == "number" && IGNORE.indexOf(p) == -1);
    // console.log(chartCandidates, chartCandidates.length);

    buildSpeedAltChart();
    if (chartCandidates.length > 0) {
        buildOtherCharts();
    }
}

function get_property_values(label) {
    return pointFeatures.map((f) => f.properties[label]);
}

function get_index_for_value(arr, value) {
    let index = arr.indexOf(value);
    if (index > -1) { // found
        return index;
    }
    index = 0;
    while (value > arr[index] && index < arr.length) {
        index++;
    }
    return index;
}

function buildSpeedAltChart() {
    for (i = 0; i < geojson.features.length - 1; i++) {
        date = new Date(geojson.features[i].properties._raw_ts * 1000);
        fmt = new Intl.DateTimeFormat("en-GB", {
            timeStyle: "long",
        }).format(date);
        fmt = fmt.substr(0, 8);
        tlabels.push(geojson.features[i].properties._raw_ts * 1000);
    }
    let spd = get_property_values(SPEED)  // speed is in m/s
    spd = spd.map((s) => s * SPEED_CONVERT[SPEED_UNIT])
    let alt = get_property_values(ALTITUDE) // alt is in ft
    alt = alt.map((s) => s * ALTITUDE_CONVERT[ALTITUDE_UNIT])


    const zoomOptions = {
      pan: {
        enabled: true,
        mode: 'x',
        modifierKey: 'shift',
      },
      zoom: {
        mode: 'x',
        drag: {
          enabled: true,
          borderColor: 'rgb(54, 162, 235)',
          borderWidth: 1,
          backgroundColor: 'rgba(54, 162, 235, 0.3)'
        }
      }
    };

    const data = {
        labels: tlabels,
        datasets: [{
            backgroundColor: "rgba(253, 128, 8, 0.2)",
            borderColor: "rgba(253, 128, 8, 1)", // orange
            borderWidth: 2,
            data: spd,
            label: SPEED.replaceAll("_", " "),
            pointRadius: 0,
            tension: 0,
            yAxisID: "y",
        }, {
            backgroundColor: "rgba(15, 128, 255, 0.2)",
            borderColor: "rgba(15, 128, 255, 1)", // blue
            borderWidth: 2,
            data: alt,
            label: ALTITUDE.replaceAll("_", " "),
            pointRadius: 0,
            tension: 0,
            yAxisID: "y1",
        }]
    };
    const config = {
        type: "line",
        plugins: [{ // https://stackoverflow.com/questions/68058199/chartjs-need-help-on-drawing-a-vertical-line-when-hovering-cursor
            afterDraw: chart => {
                if (chart.tooltip?._active?.length) {
                    let x = chart.tooltip._active[0].element.x;
                    let yAxis = chart.scales.y;
                    let ctx = chart.ctx;
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(x, yAxis.top);
                    ctx.lineTo(x, yAxis.bottom);
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = "rgba(0, 0, 255, 0.4)";
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }],
        data: data,
        options: {
            responsive: true,
            maintainAspectRatio: false,
            onHover: (e) => {
                const canvasPosition = Chart.helpers.getRelativePosition(e, mainChart);
                // get index for value
                // index = mainChart.scales.x.getValueForPixel(canvasPosition.x);
                const value = mainChart.scales.x.getValueForPixel(canvasPosition.x);
                const index = get_index_for_value(tlabels, value);
                // console.log("main", canvasPosition, value, index);
                moveMapCursor(index);
            },
            plugins: {
                zoom: zoomOptions,
                legend: {
                    position: "top",
                },
                title: {
                  display: true,
                  text: "Above: map, below: Aircraft speed and altitude MSL"
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            let label = context.dataset.label || '';

                            if (label) {
                                label += ': ';
                            }
                            if (context.parsed.y !== null) {
                                if (context.dataset.label == SPEED.replaceAll("_", " ")) {
                                    label += Math.round(context.parsed.y, 0) + SPEED_UNIT;
                                } else if (context.dataset.label == ALTITUDE.replaceAll("_", " ")) {
                                    label += Math.round(context.parsed.y, 0) + ALTITUDE_UNIT;
                                }
                            }
                            return label;
                        }
                    }
                },
            },
            scales: {
                x: {
                  type: "timeseries",
                },
                y: {
                    type: "linear",
                    display: true,
                    position: "left",
                    title: {
                        display: true,
                        text: "Speed (" + SPEED_UNIT + ")",
                        color: data["datasets"][0]["borderColor"],
                        padding: {
                            top: 30,
                            left: 0,
                            right: 0,
                            bottom: 0
                        }
                    },
                },
                y1: {
                    type: "linear",
                    display: true,
                    position: "right",
                    title: {
                        display: true,
                        text: "Altitude (" + ALTITUDE_UNIT + ")",
                        color: data["datasets"][1]["borderColor"],
                        padding: {
                            top: 30,
                            left: 0,
                            right: 0,
                            bottom: 0
                        }
                    },
                    // grid line settings
                    grid: {
                        drawOnChartArea: false, // only want the grid lines for one axis to show up
                    },
                },
            },
            interaction: {
                intersect: false,
                mode: "index",
            },
        },
    };
    const ctx = document.getElementById("mainChart");
    mainChart = new Chart(ctx, config);

    const container = document.getElementById("zoom_container");
    let button = document.createElement("button");
    button.type ="button";
    button.innerHTML = "Reset zoom";
    button.id = "zoom";
    button.addEventListener("click", function() {
        mainChart.resetZoom();
    });
    container.appendChild(button);

}

function buildOtherCharts() {
    let i = 0;
    let datasets = []
    let title = []
    while (i < chartCandidates.length) {
        let label = chartCandidates[i];
        let data = get_property_values(label);
        title.push(label.replaceAll("_", " "))
        datasets.push({
            backgroundColor: get_color(i) + "60", // transparency
            borderColor: get_color(i),
            borderWidth: 2,
            data: data,
            label: label.replaceAll("_", " "),
            pointRadius: 0,
            tension: 0,
            yAxisID: MAX_DATA_PER_CHART == 2 && (i%2) == 1 ? "y1" : "y",
        });
        if (datasets.length >= MAX_DATA_PER_CHART) {
            addChart(title, datasets);
            title = [];
            datasets = [];
        }
        i++;
    }
    if (datasets.length > 0) {
        addChart(title, datasets);
    }
}

function addChart(title, datasets) {
    const chartId = "chart" + title.join("").replaceAll(" ", "")
    const frame = document.getElementById("charts");
    let canvas = document.createElement("canvas");
    canvas.id = chartId;
    frame.appendChild(canvas);
    const ctx = document.getElementById(chartId);

    const config = {
        type: "line",
        plugins: [{ // https://stackoverflow.com/questions/68058199/chartjs-need-help-on-drawing-a-vertical-line-when-hovering-cursor
            afterDraw: chart => {
                if (chart.tooltip?._active?.length) {
                    let x = chart.tooltip._active[0].element.x;
                    let yAxis = chart.scales.y;
                    let ctx = chart.ctx;
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(x, yAxis.top);
                    ctx.lineTo(x, yAxis.bottom);
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = "rgba(0, 0, 255, 0.4)";
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }],
        data: {
            labels: tlabels,
            datasets: datasets
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            onHover: (e) => {
                const canvasPosition = Chart.helpers.getRelativePosition(e, otherCharts[chartId]);
                // get index for value
                // index = mainChart.scales.x.getValueForPixel(canvasPosition.x);
                const value = mainChart.scales.x.getValueForPixel(canvasPosition.x);
                const index = get_index_for_value(tlabels, value);
                // console.log("other", chartId, canvasPosition, index);
                moveMapCursor(index);
            },
            scales: {
                x: {
                  type: "timeseries",
                },
            },
            plugins: {
                legend: {
                    position: "top",
                },
                title: {
                    display: true,
                    text: title.join(", ")
                }
            },
            interaction: {
                intersect: false,
                mode: "index",
            }
        },
    };
    if (MAX_DATA_PER_CHART == 2 && datasets.length == 2) {
        let before = config["options"]["scales"] ? config["options"]["scales"] : {}
        config["options"]["scales"] = Object.assign({}, before, {
                y: {
                    type: "linear",
                    display: true,
                    position: "left",
                    title: {
                        display: true,
                        text: datasets[0]["label"],
                        color: datasets[0]["borderColor"],
                        padding: {
                            top: 30,
                            left: 0,
                            right: 0,
                            bottom: 0
                        }
                    },
                },
                y1: {
                    type: "linear",
                    display: true,
                    position: "right",
                    title: {
                        display: true,
                        text: datasets[1]["label"],
                        color: datasets[1]["borderColor"],
                        padding: {
                            top: 30,
                            left: 0,
                            right: 0,
                            bottom: 0
                        }
                    },
                    // grid line settings
                    grid: {
                        drawOnChartArea: false, // only want the grid lines for one axis to show up
                    },
                },
            }
        );
    }
    otherCharts[chartId] = new Chart(ctx, config);
}

function convertDegreesToRadians(degrees) {
    return degrees * (Math.PI / 180);
}

function convertRadiansToDegrees(radians) {
    return radians * (180 / Math.PI);
}

function bearing(src, dst) {
    if (src == undefined || dst == undefined) {
        console.log("warning", src, dst);
        return 0;
    }
    lat1 = convertDegreesToRadians(src.geometry.coordinates[1])
    lon1 = convertDegreesToRadians(src.geometry.coordinates[0])
    lat2 = convertDegreesToRadians(dst.geometry.coordinates[1])
    lon2 = convertDegreesToRadians(dst.geometry.coordinates[0])
    y = Math.sin(lon2 - lon1) * Math.cos(lat2);
    x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(lon2 - lon1);
    t = Math.atan2(y, x);
    return convertRadiansToDegrees(t);
}

function moveMapCursor(idx) {
    if (idx == undefined) {
        console.log("warning", idx);
        return;
    }
    let rot = bearing(geojson.features[idx], geojson.features[idx+1]) + AIRCRAFT_ICON_ROTATION;
    mapCursor.setLatLng(latlngs[idx]);
    mapCursor._icon.style.transformOrigin = Math.round(AIRCRAFT_ICON_SIZE/2) + "px " +
                                            Math.round(AIRCRAFT_ICON_SIZE/2) + "px";
    mapCursor._icon.style.transform += ' rotateZ(' + Math.round(rot) + 'deg)';
    // console.log(mapCursor._icon.style.transform);
}

function moveChartCursor(idx) {
    let x = mainChart.scales.x.getPixelForValue(tlabels[idx], idx);
    let yAxis = mainChart.scales.y;
    let ctx = mainChart.ctx;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x, yAxis.top);
    ctx.lineTo(x, yAxis.bottom);
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(0, 0, 255, 0.4)";
    ctx.stroke();
    ctx.restore();
    Object.values(otherCharts).forEach( (chart) => {
        let x = chart.scales.x.getPixelForValue(tlabels[idx], idx);
        let yAxis = chart.scales.y;
        let ctx = chart.ctx;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x, yAxis.top);
        ctx.lineTo(x, yAxis.bottom);
        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(0, 0, 255, 0.4)";
        ctx.stroke();
        ctx.restore();
    })
}

COLORS = [
    '#e6194b',
    '#3cb44b',
    '#ffe119',
    '#4363d8',
    '#f58231',
    '#911eb4',
    '#46f0f0',
    '#f032e6',
    '#bcf60c',
    '#fabebe',
    '#008080',
    '#e6beff',
    '#9a6324',
    '#fffac8',
    '#800000',
    '#aaffc3',
    '#808000',
    '#ffd8b1',
    '#000075',
    '#808080',
    '#ffffff',
    '#000000'
];

function get_color(idx) {
    return COLORS[idx % COLORS.length];
}

document.getElementById("geojsonfile")
    .addEventListener("change", function() {
        let fr = new FileReader();
        fr.onload = function() {
            buildMap(fr.result);
        };
        fr.readAsText(this.files[0]);
    });
</script>
